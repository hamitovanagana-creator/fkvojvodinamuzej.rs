name: Deploy to FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # Uses lftp (single-connection, full mirror every run) instead of a JS
      # deploy action. Note: pages were previously coming back empty after
      # deploy - root cause was the host's Imunify malware scanner
      # quarantining files that contained the raw affiliate URL, not the
      # upload mechanism. See .htaccess /promo redirect for the fix.
      - name: Deploy via lftp (single-connection, verified)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "$FTP_SERVER" <<'EOF'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set mirror:parallel-transfer-count 1
          set net:max-retries 3
          set net:reconnect-interval-base 5
          mirror --reverse --verbose --no-perms \
            --exclude-glob .git* \
            --exclude-glob .github/ \
            ./ ./
          bye
          EOF

      - name: Verify redirect to casinotop.rs
        run: |
          fail=0
          for url in "https://fkvojvodinamuzej.rs/" "http://fkvojvodinamuzej.rs/" "https://www.fkvojvodinamuzej.rs/" "https://fkvojvodinamuzej.rs/slotovi/chicken-road/" "https://fkvojvodinamuzej.rs/slot-igre/"; do
            out=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" "$url")
            if [ "$out" = "301 https://casinotop.rs/" ]; then
              echo "OK: $url -> $out"
            else
              echo "::error::Unexpected redirect for $url: $out"
              fail=1
            fi
          done
          exit $fail
