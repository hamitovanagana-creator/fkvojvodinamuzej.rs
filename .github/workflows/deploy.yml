name: Deploy to FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # Uses lftp (single-connection, full mirror every run) instead of a JS
      # deploy action. Note: pages were previously coming back empty after
      # deploy - root cause was the host's Imunify malware scanner
      # quarantining files that contained the raw affiliate URL, not the
      # upload mechanism. See .htaccess /promo redirect for the fix.
      - name: Deploy via lftp (single-connection, verified)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "$FTP_SERVER" <<'EOF'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set mirror:parallel-transfer-count 1
          set net:max-retries 3
          set net:reconnect-interval-base 5
          mirror --reverse --verbose --no-perms \
            --exclude-glob .git* \
            --exclude-glob .github/ \
            ./ ./
          bye
          EOF

      - name: Verify deploy (fail loudly on empty pages)
        run: |
          fail=0
          for path in "" "slotovi/chicken-road/" "slotovi/chicken-road-2/" "slotovi/sweet-bonanza/" "slotovi/sweet-bonanza-super-scatter/" "slotovi/gates-of-olympus/" "slotovi/starlight-princess/" "slotovi/starlight-princess-super-scatter/" "slotovi/sugar-rush/" "slotovi/the-dog-house-megaways/" "slotovi/big-bass-splash/" "slotovi/respin-joker/" "slotovi/eternal-diamonds/" "slotovi/helios-triple-sun/" "slotovi/triple-hop-pots/" "slotovi/gates-of-olympus-2500/" "slotovi/forever-split/" "slotovi/deep-sea-frenzy/" "o-nama/" "kontakt/" "odgovorno-kockanje/" "privacy-policy/" "uslovi-koriscenja/"; do
            url="https://fkvojvodinamuzej.rs/${path}"
            size=$(curl -s -o /dev/null -w "%{size_download}" "$url")
            if [ "$size" -lt 500 ]; then
              echo "::error::HTTP-SIDE EMPTY OR TOO SMALL: $url ($size bytes) — upload OK, serving/caching layer is the problem"
              fail=1
            else
              echo "OK: $url ($size bytes)"
            fi
          done
          exit $fail
