name: Deploy to FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          # Unique state file per run forces a full re-upload every deploy instead of
          # relying on git-diff-based incremental sync, which silently produced
          # empty (0-byte) files for a subset of pages on a previous deploy.
          state-name: ".ftp-deploy-sync-state-${{ github.run_id }}.json"
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
